<svg width="1680" height="1060" viewBox="0 0 1680 1060" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Liberation Sans, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
